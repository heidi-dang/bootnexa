name: Web and local agent quality gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python3 tests/virtual-media/verify-linux-profile.py
      - run: python3 -m unittest discover -s tests/virtual-media -p 'test_*.py' -v
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke -- --workers=1

  uefi_boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and open-source OVMF firmware
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Generate and actually boot the virtual EFI media
        run: bash ./tests/virtual-media/boot-ovmf.sh

  linux_iso_boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux virtual-boot test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
      - name: Verify official Alpine SHA-256, copy to virtual disk, boot OS
        run: bash ./tests/virtual-media/alpine-virt-ovmf.sh
      - name: Preserve CI-only virtual boot evidence and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpine-virt-ovmf-evidence
          path: test-results/alpine-virtual-boot/
          if-no-files-found: warn
          retention-days: 14

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --manifest-path agent/Cargo.toml --check
      - run: cargo test --manifest-path agent/Cargo.toml --locked --all-targets
      - run: cargo clippy --manifest-path agent/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build real Windows agent executable
        if: matrix.os == 'windows-latest'
        run: cargo build --release --manifest-path agent/Cargo.toml --locked
      - name: Windows-native read-only agent and Storage API smoke
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./tests/windows/smoke.ps1
      - name: Windows authenticated read-only named-pipe broker acceptance
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./tests/windows/pipe-smoke.ps1
      - name: Windows cross-user, low-integrity and deadline adversarial acceptance
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./tests/windows/pipe-adversarial.ps1
      - name: Install pinned Inno Setup compiler
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Create ephemeral CI-only test signing certificate
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/windows/New-TestCertificate.ps1
      - name: Sign and assemble complete test installer and uninstaller
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/windows/Build-Installer.ps1 -Thumbprint $env:BOOTNEXA_SIGNER_THUMBPRINT -Mode Test
      - name: Enforce production release trust and missing-credential rejection
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./tests/windows/production-gates-smoke.ps1
      - name: Verify per-user silent install, signed files and uninstall
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./tests/windows/installer-smoke.ps1
