name: Signed BootNexa Windows agent release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag pointing to the current main commit
        type: string
        required: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject stale, unexpected or off-main signing refs
        id: ref
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Run signing from main only"; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must be stable vX.Y.Z"; exit 1; }
          git fetch --force origin main --tags
          branch_sha="$(git rev-parse refs/remotes/origin/main)"
          release_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          [[ "$branch_sha" == "$GITHUB_SHA" && "$release_sha" == "$branch_sha" ]] || {
            echo "Release must match current main HEAD; never sign a stale tag"; exit 1;
          }
          version="${RELEASE_TAG#v}"
          grep -Fx "version = \"$version\"" agent/Cargo.toml >/dev/null || { echo "Tag/agent version mismatch"; exit 1; }
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists. Refusing overwrite"; exit 1;
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

  signed-windows-agent:
    needs: preflight
    runs-on: windows-latest
    # The production environment is configured on GitHub with required review,
    # administrator bypass disabled and main-only deployment policy.
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Revalidate main identity after approval
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.release_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git fetch origin main --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check current main.' }
          $actualMain = (git rev-parse origin/main).Trim()
          $actualBuild = (git rev-parse HEAD).Trim()
          if ($actualMain -ne $env:EXPECTED_SHA -or $actualBuild -ne $env:EXPECTED_SHA) {
            throw 'Main moved after preflight; restart signing against fresh main.'
          }
          if (@(git tag --points-at HEAD) -notcontains $env:RELEASE_TAG) { throw 'Expected tag missing from release commit.' }
      - name: Import verified production signing certificate
        shell: pwsh
        env:
          BOOTNEXA_CODESIGN_PFX_B64: ${{ secrets.BOOTNEXA_CODESIGN_PFX_B64 }}
          BOOTNEXA_CODESIGN_PFX_PASSWORD: ${{ secrets.BOOTNEXA_CODESIGN_PFX_PASSWORD }}
          BOOTNEXA_CODESIGN_THUMBPRINT: ${{ vars.BOOTNEXA_CODESIGN_THUMBPRINT }}
        run: ./scripts/windows/Import-ReleaseCertificate.ps1
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Qualify Windows read-only agent
        shell: pwsh
        run: |
          cargo test --manifest-path agent/Cargo.toml --locked --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed.' }
          cargo clippy --manifest-path agent/Cargo.toml --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Rust lint failed.' }
      - name: Build release EXE with locked dependency graph
        shell: pwsh
        run: |
          cargo build --release --manifest-path agent/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
      - name: Sign EXE, embedded uninstaller and setup with timestamp
        shell: pwsh
        run: |
          if (-not $env:BOOTNEXA_SIGNER_THUMBPRINT) { throw 'Missing trusted signer.' }
          ./scripts/windows/Build-Installer.ps1 -Thumbprint $env:BOOTNEXA_SIGNER_THUMBPRINT -Mode Production
      - name: Verify installed production payload and clean uninstall
        shell: pwsh
        run: ./tests/windows/installer-smoke.ps1 -Production
      - name: Record SHA256 provenance
        shell: pwsh
        run: |
          $artifact = @(Get-ChildItem -Path 'out/windows' -Filter '*-Setup.exe')
          if ($artifact.Count -ne 1) { throw 'Expected exactly one installer.' }
          $line = (Get-FileHash -Algorithm SHA256 $artifact[0].FullName).Hash.ToLowerInvariant() + '  ' + $artifact[0].Name
          $line | Set-Content -Path 'out/windows/SHA256SUMS.txt' -Encoding ascii
      - name: Publish only trusted signed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.release_sha }}
        run: |
          git fetch origin main --quiet
          if ($LASTEXITCODE -ne 0 -or (git rev-parse origin/main).Trim() -ne $env:EXPECTED_SHA) {
            throw 'Main changed during packaging; release blocked.'
          }
          $installer = @(Get-ChildItem -Path 'out/windows' -Filter '*-Setup.exe')
          if ($installer.Count -ne 1) { throw 'Installer missing.' }
          . ./scripts/windows/Signing.Common.ps1
          Assert-SignedFile -Path $installer[0].FullName -Thumbprint $env:BOOTNEXA_SIGNER_THUMBPRINT -RequireTimestamp
          gh release create $env:RELEASE_TAG $installer[0].FullName 'out/windows/SHA256SUMS.txt' --verify-tag --title "BootNexa Agent $env:RELEASE_TAG" --notes 'Trusted, signed Windows x64 read-only agent installer. No disk-writing capability. Native approval required before USB inventory.'
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }
